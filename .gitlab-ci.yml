image: golang:latest

variables:
  # Please edit to your GitLab project
  REPO_NAME: gitlab.com/chrisconley/go-hangman

# The problem is that to be able to use go get, one needs to put
# the repository in the $GOPATH. So for example if your gitlab domain
# is gitlab.com, and that your repository is namespace/project, and
# the default GOPATH being /go, then you'd need to have your
# repository in /go/src/gitlab.com/namespace/project
# Thus, making a symbolic link corrects this.
before_script:
  - mkdir -p $GOPATH/src/$(dirname $REPO_NAME)
  - ln -svf $CI_PROJECT_DIR $GOPATH/src/$REPO_NAME
  - cd $GOPATH/src/$REPO_NAME

stages:
  - test
  - build
  - run

test:
  stage: test
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)
    - go test -race $(go list ./... | grep -v /vendor/) -v -coverprofile coverage.out
    - go tool cover -func=coverage.out

build:
  stage: build
  script:
    - go build -race -ldflags "-extldflags '-static'" -o $CI_PROJECT_DIR/player ./cmd/player.go
  artifacts:
    paths:
      - player

hangman:
  stage: run
  script:
    - head -n 1000 $CI_PROJECT_DIR/fixtures/nine-letter-words.txt | ./player -game hangman -motivation.entropy 1.0
    - head -n 1000 $CI_PROJECT_DIR/fixtures/nine-letter-words.txt | ./player -game hangman -motivation.minimax 1.0
    - head -n 1000 $CI_PROJECT_DIR/fixtures/nine-letter-words.txt | ./player -game hangman -motivation.reward 1.0

mastermind:
  stage: run
  script:
    - head -n 100 $CI_PROJECT_DIR/fixtures/commercial-mastermind.txt | ./player -game mastermind -motivation.entropy 1.0
    - head -n 100 $CI_PROJECT_DIR/fixtures/commercial-mastermind.txt | ./player -game mastermind -motivation.minimax 1.0
    - head -n 100 $CI_PROJECT_DIR/fixtures/commercial-mastermind.txt | ./player -game mastermind -motivation.reward 1.0